apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoserver
  namespace: jaldrishti
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geoserver
  template:
    metadata:
      labels:
        app: geoserver
    spec:
      containers:
      - name: geoserver
        image: iirs-geoserver:latest  # Replace with your image registry
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: jaldrishti-config
        env:
        - name: GEOSERVER_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: jaldrishti-secrets
              key: GEOSERVER_ADMIN_USER
        - name: GEOSERVER_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jaldrishti-secrets
              key: GEOSERVER_ADMIN_PASSWORD
        - name: GEOSERVER_DATA_DIR
          value: /opt/geoserver/data_dir
        volumeMounts:
        - name: geoserver-data
          mountPath: /opt/geoserver/data_dir
        - name: backend-data
          mountPath: /app/data
          readOnly: true
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /geoserver/web/
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /geoserver/web/
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
      volumes:
      - name: geoserver-data
        persistentVolumeClaim:
          claimName: geoserver-data-pvc
      - name: backend-data
        persistentVolumeClaim:
          claimName: backend-data-pvc
          readOnly: true